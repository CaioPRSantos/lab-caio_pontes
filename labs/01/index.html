```html
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Entre em contato com nosso suporte técnico. Envie suas dúvidas e solicitações através desta página.">

    <title>Contato - Área do Cliente</title>
</head>

<body>

    <header id="header">
        <h1 class="titulo-principal">Área de Contato do Cliente</h1>

        <nav class="navegacao">
            <a href="#">Ajuda</a> |
            <a href="#">Sair</a>
        </nav>
    </header>

    <main id="conteudo-principal">

        <section class="area-contato">
            <h2>Envie sua mensagem para nossa equipe de suporte técnico</h2>

            <form action="/enviar" method="POST">

                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome" minlength="3" required>
                <br><br>

                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" minlength="5" required>
                <br><br>

                <label for="celular">Telefone celular:</label>
                <input type="tel" id="celular" name="celular"
                       pattern="[0-9]{11}"
                       title="Informe os 11 números do telefone"
                       required>
                <br><br>

                <label for="msg">Sua mensagem:</label>
                <textarea id="msg" name="msg" required></textarea>
                <br><br>

                <input type="submit" value="Enviar mensagem">

            </form>
        </section>

    </main>

    <footer id="footer">
        <p>Suporte Tech - 2026</p>
    </footer>

</body>
</html>
```
